name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_password
      ERP_READER_USER: erp_reader
      ERP_READER_PASSWORD: erp_reader_local_password
      RAW_URI: data/raw
      WAREHOUSE_PATH: data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run erp db migrate
      - run: uv run dbt deps --project-dir transform --profiles-dir transform
      - run: uv run sqlfluff lint transform/models
      - run: uv run pytest

  end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_password
      ERP_READER_USER: erp_reader
      ERP_READER_PASSWORD: erp_reader_local_password
      RAW_URI: data/raw
      WAREHOUSE_PATH: data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run erp db migrate
      - run: uv run erp seed
      - run: uv run erp simulate --ticks 20
      - run: uv run erp run
      - run: uv run erp simulate --ticks 5
      - run: uv run erp run
      - run: uv run erp simulate --ticks 20 --seed 7 --with-deletes
      - run: uv run erp run
