[project]
name = "erp-platform"
version = "0.1.0"
description = "Simulated ERP feeding an incremental pipeline into a dbt-modelled warehouse"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11,<2",
    "duckdb>=2.0.0",
    "faker>=40.54.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
]

[project.scripts]
erp = "erp_platform.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]

[tool.pytest.ini_options]
# The system temp directory is not writable on every development machine.
addopts = "--basetemp=.pytest_tmp"
