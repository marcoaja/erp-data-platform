version: 2

sources:
  - name: erp
    description: Append-only Parquet written by `erp extract`; one row per extracted version.
    meta:
      # union_by_name lets files written before and after a source schema change read together.
      external_location: "read_parquet('{{ env_var('RAW_URI', 'data/raw') }}/{name}/*/*.parquet', union_by_name = true)"
    tables:
      - name: dealers
      - name: customers
      - name: parts
      - name: sales_orders
      - name: order_lines
      - name: inventory
      # One row per extract with the source's own totals; compared by reconciliation_runs.
      - name: control_totals

  - name: fx
    description: Daily exchange rates written by `erp fx`; the same date can appear in several files when the API revised it.
    meta:
      external_location: "read_parquet('{{ env_var('RAW_URI', 'data/raw') }}/{name}/*/*.parquet', union_by_name = true)"
    tables:
      - name: fx_rates
