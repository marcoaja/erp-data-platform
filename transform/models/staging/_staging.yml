version: 2

models:
  - name: stg_erp__dealers
    description: >
      Dealer versions. Grain: one row per dealer id and updated_at, deduplicated across
      overlapping extracts.
    columns:
      - name: dealer_id
        description: Primary key of the source row; repeats across versions.
        data_tests: [not_null]
      - name: updated_at
        description: When the ERP wrote this version. With the id it identifies a version.
        data_tests: [not_null]
      - name: is_current
        description: True on the newest extracted version of each id.
        data_tests: [not_null]
      - name: is_deleted
        description: True when the id is missing from the latest keys snapshot, so the row was hard-deleted in the ERP. Set on every version of the id.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [dealer_id, updated_at]
