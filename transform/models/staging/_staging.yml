  - name: stg_fx__rates
    description: >
      Exchange rates published by the API. Grain: one row per rate_date and currency_code, the
      most recently fetched value.
    columns:
      - name: rate_date
        description: The day the rate was published for.
        data_tests: [not_null]
      - name: base_currency
        description: Currency the rate is relative to; always JPY.
        data_tests:
          - accepted_values:
              arguments:
                values: [JPY]
      - name: currency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [IDR, THB]
      - name: rate
        description: Units of currency_code per one JPY.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency_code]
