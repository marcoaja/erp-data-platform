# Defaults exist so tooling (sqlfluff, dbt debug) works without an env file; `erp transform`
# always passes the real values from config.py.
erp_warehouse:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH', 'data/warehouse.duckdb') }}"
      schema: main
      threads: 4
      # Casting timestamptz to date must use the UTC calendar day, not the host's.
      settings:
        TimeZone: UTC
